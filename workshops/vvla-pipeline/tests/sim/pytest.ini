[pytest]
# Digital-twin scenario tests - see conftest.py for options.
#   notebooks: cd workshop && ./run_notebooks.sh --test
#   twin:      ./run_sim_tests.sh
#   cpu yolo:  ./run_sim_tests.sh --sim-yolo-device cpu
#   videos:    ./run_sim_tests.sh --sim-video failed
#   seg eyes:  ./run_sim_tests.sh --sim-eyes seg
#   student:   PROJECT=project ./run_sim_tests.sh -k workshop
markers =
    sim: digital-twin scenario (tier 1 unless also hw)
    hw: tier 2 - full ROS 2 graph on the iGPU
    slow: long-running scenario
    docs: runs what workshop/README.md documents (notebooks, commands)
# ROS 2's launch_testing plugins replace Python's logger class, which leaves
# caplog empty. These tests do not use them.
addopts = -p no:cacheprovider -ra -p no:launch_testing -p no:launch_ros
# Hang guard only: every wait is on an event, and every move inside a
# behavior fails on its own servo-profile budget, so no passing test nears it.
timeout = 300
log_level = INFO
log_format = %(asctime)s.%(msecs)03d %(levelname)s %(name)s [%(threadName)s]: %(message)s
log_date_format = %H:%M:%S
testpaths = .
