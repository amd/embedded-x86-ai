[pytest]
# Digital-twin scenario tests - see conftest.py for options.
#   everything: cd workshop && ./run_notebooks.sh --test
#   tier 1: pytest tests/sim -m "sim and not hw"
#   tier 2: source /opt/ros/jazzy/setup.bash && pytest tests/sim -m "hw and not docs"
#   docs:   source /opt/ros/jazzy/setup.bash && pytest tests/sim -m docs
markers =
    sim: digital-twin scenario (tier 1 unless also hw)
    hw: tier 2 - full ROS 2 graph on the iGPU
    slow: long-running scenario
    docs: runs what workshop/README.md documents (notebooks, commands)
# ROS 2's launch_testing plugins replace Python's logger class, which leaves
# caplog empty. These tests do not use them.
addopts = -p no:cacheprovider -ra -p no:launch_testing -p no:launch_ros
log_level = INFO
testpaths = .
